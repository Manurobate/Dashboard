<div class="form-page form-page-centered">
  <div class="form-card login-card">
    <div class="login-brand">
      <img src="icon-app.svg" alt="" class="login-logo" aria-hidden="true" />
      <h1 class="login-title">Dashboard</h1>
      <p class="login-subtitle">Connexion à votre espace</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <label class="field-label" for="login-username">Adresse e-mail</label>
      <mat-form-field appearance="outline" class="ember-field" subscriptSizing="dynamic">
        <input
          matInput
          id="login-username"
          type="email"
          formControlName="username"
          autocomplete="email"
        />
      </mat-form-field>

      <label class="field-label" for="login-password">Mot de passe</label>
      <mat-form-field
        appearance="outline"
        class="ember-field"
        subscriptSizing="dynamic"
        [class.field-error-state]="errorMessage()"
      >
        <input
          matInput
          id="login-password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="errorMessage() ? true : null"
          [attr.aria-describedby]="errorMessage() ? 'login-error' : null"
        />
      </mat-form-field>
      @if (errorMessage()) {
        <p class="form-error login-error" id="login-error" role="alert">
          <mat-icon aria-hidden="true">error</mat-icon>
          {{ errorMessage() }}
        </p>
      }

      <button
        mat-flat-button
        type="submit"
        [disabled]="form.invalid || isLoading()"
        class="ember-btn ember-btn-block submit-btn"
      >
        @if (isLoading()) {
          <mat-progress-spinner diameter="20" mode="indeterminate" />
        } @else {
          Connexion
        }
      </button>
    </form>
  </div>
</div>
