<section class="settings-card" aria-labelledby="display-settings-title">
  <div class="settings-card-header">
    <span class="settings-card-icon" aria-hidden="true">
      <mat-icon>animation</mat-icon>
    </span>
    <div>
      <h2 class="settings-card-title" id="display-settings-title">Affichage</h2>
      <p class="settings-card-description">
        Personnalisez l'affichage de Dashboard sur cet appareil.
      </p>
    </div>
  </div>

  <div class="settings-card-body">
    <!-- mat-slide-toggle nomme son bouton interne « {id}-button » : cible du label visible -->
    <div class="settings-row">
      <div>
        <label class="settings-row-label" id="animations-label" for="animations-toggle-button"
          >Animations</label
        >
        <p class="settings-row-description" id="animations-description">
          Transitions et effets d'apparition.
        </p>
      </div>
      <mat-slide-toggle
        id="animations-toggle"
        class="ember-toggle"
        hideIcon
        [checked]="motion.enabled()"
        (change)="onToggle($event)"
        aria-labelledby="animations-label"
        aria-describedby="animations-description"
      />
    </div>
  </div>
</section>
