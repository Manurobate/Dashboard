<div class="ingredient-row" [formGroup]="formGroup" cdkDrag>
  <mat-icon cdkDragHandle class="drag-handle" aria-hidden="true">drag_indicator</mat-icon>

  <div class="field field-quantity">
    <label class="field-label" [for]="rowId + '-qty'"
      >Qté<span class="field-required" aria-hidden="true">*</span></label
    >
    <mat-form-field appearance="outline" class="ember-field" subscriptSizing="dynamic">
      <input
        matInput
        [id]="rowId + '-qty'"
        type="number"
        formControlName="quantity"
        min="1"
        step="1"
      />
      <mat-error *ngIf="formGroup.get('quantity')?.hasError('required')">Requis</mat-error>
    </mat-form-field>
  </div>

  <div class="field field-unit">
    <label class="field-label" [for]="rowId + '-unit'">Unité</label>
    <mat-form-field appearance="outline" class="ember-field" subscriptSizing="dynamic">
      <input
        matInput
        [id]="rowId + '-unit'"
        formControlName="unit"
        placeholder="g, ml, …"
        maxlength="50"
        [matAutocomplete]="unitAuto"
        (input)="unitQuery.set($any($event.target).value)"
      />
      <mat-autocomplete #unitAuto>
        @for (s of filteredUnits(); track s) {
          <mat-option [value]="s">{{ s }}</mat-option>
        }
      </mat-autocomplete>
    </mat-form-field>
  </div>

  <div class="field field-name">
    <label class="field-label" [for]="rowId + '-name'"
      >Ingrédient<span class="field-required" aria-hidden="true">*</span></label
    >
    <mat-form-field appearance="outline" class="ember-field" subscriptSizing="dynamic">
      <input
        matInput
        [id]="rowId + '-name'"
        formControlName="name"
        maxlength="255"
        [matAutocomplete]="nameAuto"
        (input)="nameQuery.set($any($event.target).value)"
      />
      <mat-autocomplete #nameAuto>
        @for (s of filteredIngredients(); track s) {
          <mat-option [value]="s">{{ s }}</mat-option>
        }
      </mat-autocomplete>
      <mat-error *ngIf="formGroup.get('name')?.hasError('required')">Requis</mat-error>
    </mat-form-field>
  </div>

  <button
    type="button"
    mat-icon-button
    class="delete-btn"
    matTooltip="Supprimer"
    (click)="deleteRow.emit()"
    aria-label="Supprimer cet ingrédient"
  >
    <mat-icon>delete</mat-icon>
  </button>

  <div *cdkDragPlaceholder class="drag-placeholder"></div>
</div>
