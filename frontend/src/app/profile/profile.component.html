<div class="profile-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Mon profil</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Adresse email</mat-label>
        <input matInput [value]="authService.currentUser()?.username ?? ''" readonly />
      </mat-form-field>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nom d'affichage</mat-label>
          <input matInput formControlName="name" autocomplete="name" />
          @if (form.get('name')?.hasError('required') && form.get('name')?.touched) {
            <mat-error>Le nom d'affichage est obligatoire</mat-error>
          }
        </mat-form-field>

        <div class="actions">
          <button mat-stroked-button type="button" (click)="navigateToChangePassword()">
            Changer le mot de passe
          </button>
          <button mat-flat-button color="primary" type="submit"
                  [disabled]="form.invalid || isLoading()">
            @if (isLoading()) {
              <mat-progress-spinner diameter="20" mode="indeterminate" />
            } @else {
              Sauvegarder
            }
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
