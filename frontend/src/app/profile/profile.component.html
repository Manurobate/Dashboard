<div class="form-page">
  <div class="form-card">
    <h1 class="form-card-title">Mon profil</h1>

    <label class="field-label" for="profile-email"
      >Adresse email <span class="readonly-chip">lecture seule</span></label
    >
    <mat-form-field
      appearance="outline"
      class="ember-field readonly-field"
      subscriptSizing="dynamic"
    >
      <input
        matInput
        id="profile-email"
        [value]="authService.currentUser()?.username ?? ''"
        readonly
      />
    </mat-form-field>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <label class="field-label" for="profile-name">Nom d'affichage</label>
      <mat-form-field appearance="outline" class="ember-field" subscriptSizing="dynamic">
        <input matInput id="profile-name" formControlName="name" autocomplete="name" />
        @if (form.get('name')?.hasError('required') && form.get('name')?.touched) {
          <mat-error>Le nom d'affichage est obligatoire</mat-error>
        }
      </mat-form-field>

      <div class="actions">
        <button
          mat-stroked-button
          class="ember-btn ember-btn-accent"
          type="button"
          (click)="navigateToChangePassword()"
        >
          Changer le mot de passe
        </button>
        <button
          mat-flat-button
          class="ember-btn"
          type="submit"
          [disabled]="form.invalid || isLoading()"
        >
          @if (isLoading()) {
            <mat-progress-spinner diameter="20" mode="indeterminate" />
          } @else {
            Sauvegarder
          }
        </button>
      </div>
    </form>
  </div>
</div>
