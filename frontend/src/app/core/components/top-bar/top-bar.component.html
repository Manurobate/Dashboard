<mat-toolbar class="top-bar" role="banner">
  <span class="app-title">
    <img src="favicon.svg" alt="" class="app-icon" aria-hidden="true" />
    Dashboard
  </span>

  @if (authService.currentUser()) {
    <nav
      mat-tab-nav-bar
      class="desktop-nav"
      [tabPanel]="tabPanel"
      aria-label="Navigation principale"
    >
      <a
        mat-tab-link
        routerLink="/dashboard"
        routerLinkActive
        #dashboardLink="routerLinkActive"
        [active]="dashboardLink.isActive"
        >Accueil</a
      >
      <a
        mat-tab-link
        routerLink="/recipes"
        routerLinkActive
        #recipesLink="routerLinkActive"
        [active]="recipesLink.isActive"
        >Recettes</a
      >
      @if (authService.currentUser()?.notesEnabled) {
        <a
          mat-tab-link
          routerLink="/notes"
          routerLinkActive
          #notesLink="routerLinkActive"
          [active]="notesLink.isActive"
          >Notes</a
        >
      }
    </nav>
  }

  <span class="spacer"></span>

  <button
    mat-icon-button
    (click)="themeService.toggle()"
    [attr.aria-label]="themeService.isDark() ? 'Activer le thème clair' : 'Activer le thème sombre'"
  >
    <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  @if (authService.currentUser()) {
    <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Menu utilisateur">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #userMenu>
      @if (authService.currentUser()?.role === 'admin') {
        <a mat-menu-item routerLink="/admin">
          <mat-icon>admin_panel_settings</mat-icon>
          <span>Administration</span>
        </a>
      }
      <a mat-menu-item routerLink="/settings">
        <mat-icon>settings</mat-icon>
        <span>Paramètres</span>
      </a>
      <a mat-menu-item routerLink="/profile">
        <mat-icon>person</mat-icon>
        <span>Mon profil</span>
      </a>
      <button mat-menu-item (click)="onLogout()">
        <mat-icon>logout</mat-icon>
        <span>Déconnexion</span>
      </button>
    </mat-menu>
  }
</mat-toolbar>
<mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>
