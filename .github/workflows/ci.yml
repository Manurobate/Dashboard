name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  backend:
    name: Backend — Lint + Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PORT: '3000'
      DB_HOST: localhost
      DB_PORT: '3306'
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_NAME: test_db
      JWT_SECRET: test_jwt_secret_minimum_32_characters_long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint ESLint + Prettier
        run: npm run lint

      - name: Tests Jest
        run: npm test -- --forceExit

  frontend:
    name: Frontend — Prettier + Tests + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification Prettier
        run: npx prettier --check "src/**/*.{ts,html,scss}"

      - name: Tests Vitest
        run: npx ng test --watch=false

      - name: Build Angular
        run: npm run build

  e2e:
    name: E2E — Playwright (Chromium)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    # E2E uniquement au merge dans develop (push), pas sur les PRs de feature
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Créer .env pour CI
        env:
          ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
        run: |
          # Fichier à la racine du projet — docker-compose.yml utilise env_file: .env
          cat > .env <<'ENVFILE'
          PORT=3000
          DB_HOST=db
          DB_PORT=3306
          DB_USER=ci_user
          DB_PASSWORD=ci_password
          DB_NAME=ci_db
          DB_ROOT_PASSWORD=ci_root_password
          JWT_SECRET=ci_jwt_secret_minimum_32_chars_long
          JWT_EXPIRY=15m
          REFRESH_TOKEN_EXPIRY_DAYS=30
          THROTTLER_LIMIT=100
          ADMIN_INITIAL_PASSWORD=TempInit123!
          ENVFILE
          printf 'ADMIN_EMAIL=%s\n' "$ADMIN_EMAIL" >> .env

      # Construire les images depuis la source courante de develop et les taguer :latest.
      # Sans ça, `docker compose up` tire les images :latest publiées (dernière release sur main)
      # et les tests E2E valideraient du code obsolète au lieu de la branche testée.
      - name: Construire les images depuis la source
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$OWNER/dashboard-backend:latest ./backend
          docker build -t ghcr.io/$OWNER/dashboard-frontend:latest ./frontend

      - name: Démarrer la stack
        # pull_policy par défaut = "missing" : compose réutilise les images locales
        # fraîchement construites (tag :latest présent) au lieu de tirer depuis GHCR.
        run: docker compose -f docker-compose.yml up -d

      - name: Attendre que le frontend soit prêt
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost/ > /dev/null; do sleep 3; done'

      - name: Installer dépendances Playwright
        working-directory: e2e
        run: npm ci

      - name: Installer browsers Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests E2E
        working-directory: e2e
        env:
          BASE_URL: http://localhost
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_INITIAL_PASSWORD: TempInit123!
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npx playwright test

      - name: Uploader le rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Arrêter la stack
        if: always()
        run: docker compose -f docker-compose.yml down
